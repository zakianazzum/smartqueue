<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SmartQueue - Counter View</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50">

<div class="flex h-screen">

    <!-- sidebar -->
    <div class="w-52 bg-white flex flex-col border-r">
        <div class="p-5">
            <div class="w-5 h-5 bg-blue-600 rounded-full"></div>
        </div>
        <div class="px-3 space-y-1">
            <a href="index.html" class="block px-3 py-2 rounded text-gray-600 text-sm hover:bg-gray-100">Customer</a>
            <a href="admin.html" class="block px-3 py-2 rounded text-gray-600 text-sm hover:bg-gray-100">Admin Panel</a>
            <a href="counter.html" class="block px-3 py-2 rounded bg-blue-600 text-white text-sm">Counter View</a>
        </div>
        <div class="mt-auto p-4 border-t">
            <div id="clock" class="text-xs text-gray-500 mb-2">00:00:00</div>
            <a href="login.html" class="text-sm text-gray-600 hover:text-blue-600">Log Out</a>
        </div>
    </div>

    <!-- the public display -->
    <div class="flex-1 flex flex-col bg-blue-900">

        <!-- dark top bar -->
        <div class="bg-blue-950 px-6 py-3 flex justify-between items-center text-sm">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 bg-green-400 rounded-full"></span>
                <span id="counterName" class="text-white">Counter 01</span>
                <span class="text-blue-400">|</span>
                <span class="text-blue-300">Live</span>
                <select id="locationSelect" onchange="changeLocation()"
                        class="ml-4 bg-blue-900 text-blue-200 text-xs rounded px-2 py-1 border border-blue-700"></select>
            </div>
            <div class="flex items-center gap-6">
                <span id="today" class="text-blue-300"></span>
                <span id="bigClock" class="text-white font-mono"></span>
            </div>
        </div>

        <!-- paused message (SRS 9) -->
        <div id="pausedBox" class="hidden bg-orange-500 text-white text-center py-2 text-sm">
            Service is temporarily paused. Please wait.
        </div>

        <div class="flex-1 grid grid-cols-3 gap-6 p-8">

            <!-- now serving, takes 2 of the 3 columns -->
            <div class="col-span-2 flex flex-col items-center justify-center">
                <div class="text-blue-300 text-sm tracking-widest mb-2">NOW SERVING</div>
                <div id="nowServing" class="text-white font-mono font-bold leading-none"
                     style="font-size: 120px;">--</div>

                <div class="mt-10 bg-blue-800 rounded-lg px-10 py-4 text-center">
                    <div class="text-blue-300 text-xs tracking-widest">NEXT TOKEN</div>
                    <div id="nextToken" class="text-white text-3xl font-mono font-bold">--</div>
                </div>
            </div>

            <!-- queue overview on the right -->
            <div class="flex flex-col">
                <div class="text-blue-200 text-sm tracking-widest mb-3">QUEUE OVERVIEW</div>

                <div class="text-blue-400 text-xs mb-2">Waiting</div>
                <div id="waitingList" class="flex flex-wrap gap-2 mb-auto"></div>

                <div class="space-y-3">
                    <div class="bg-blue-800 rounded-lg p-4">
                        <div class="text-blue-300 text-xs tracking-widest">QUEUE LENGTH</div>
                        <div id="queueLength" class="text-white text-2xl font-bold">0</div>
                    </div>
                    <div class="bg-blue-800 rounded-lg p-4">
                        <div class="text-blue-300 text-xs tracking-widest">ACTIVE COUNTER</div>
                        <div id="activeCounter" class="text-white text-2xl font-bold">-</div>
                    </div>
                    <div class="bg-blue-800 rounded-lg p-4">
                        <div class="text-blue-300 text-xs tracking-widest">EST. AVG TIME / CUSTOMER</div>
                        <div id="avgTime" class="text-white text-2xl font-bold">0 mins</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="counter.js"></script>
</body>
</html>
